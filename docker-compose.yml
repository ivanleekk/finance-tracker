services:
    backend:
        build: ./backend
        expose:
            - "5001"
        ports:
            - "5001:5001"
        environment:
            - PORT=5001
            - HOST=0.0.0.0
            - DEBUG=false
            - DATABASE_URL=postgresql://fin:fin@db:5432/fin
            - POSTGRES_HOST=db
            - POSTGRES_PORT=5432
            - POSTGRES_DB=fin
            - POSTGRES_USER=fin
            - POSTGRES_PASSWORD=fin
        volumes:
            - ./backend:/app
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    frontend:
        build: ./frontend
        expose:
            - "5173"  # Updated to Vite's default port
        ports:
            - "5173:5173"
        environment:
            # Vite uses CHOKIDAR_USEPOLLING for hot-reloading inside Docker volumes
            - CHOKIDAR_USEPOLLING=true
            # Vite requires the VITE_ prefix for public variables instead of NEXT_PUBLIC_
            - VITE_API_URL=http://localhost:5001
            - VITE_API_URL_2=http://localhost:5002/api
            - CI=true
            - INTERNAL_API_URL=http://backend:5001
        volumes:
            - ./frontend:/app
            - /app/node_modules
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
      
    db:
      image: postgres:18-alpine
      restart: always
      environment:
        POSTGRES_DB: fin
        POSTGRES_USER: fin
        POSTGRES_PASSWORD: fin
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U fin -d fin"]
        interval: 5s
        timeout: 5s
        retries: 12
      volumes:
        - finance_tracker_db_data:/var/lib/postgresql

volumes:
  finance_tracker_db_data:
