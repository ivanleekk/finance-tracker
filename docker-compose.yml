services:
    backend:
        build:
            context: ./backend
            target: ${DOCKER_TARGET:-development}
        ports:
            - "${BACKEND_PORT:-8000}:8000"
        environment:
            - PORT=8000
            - HOST=0.0.0.0
            - DATABASE_URL=postgresql://fin:fin@db:5432/fin
            - POSTGRES_HOST=db
            - POSTGRES_PORT=5432
            - POSTGRES_DB=fin
            - POSTGRES_USER=fin
            - POSTGRES_PASSWORD=fin
            - API_URL=http://localhost:${BACKEND_PORT:-8000}
            - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
            - AUTH_COOKIE_DOMAIN=localhost
            - SCHEDULER_SECRET=local-dev-secret
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            target: ${DOCKER_TARGET:-development}
        ports:
            - "${FRONTEND_PORT:-5173}:5173"
        environment:
            - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
            - INTERNAL_API_URL=http://backend:8000
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
      
    db:
      image: postgres:18-alpine
      restart: always
      ports:
        - "${DB_PORT:-5432}:5432"
      environment:
        POSTGRES_DB: fin
        POSTGRES_USER: fin
        POSTGRES_PASSWORD: fin
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U fin -d fin"]
        interval: 5s
        timeout: 5s
        retries: 12
      volumes:
        - finance_tracker_db_data:/var/lib/postgresql

volumes:
  finance_tracker_db_data:
