services:
    backend:
        build:
            context: ./backend
            target: ${DOCKER_TARGET:-development}
        expose:
            - "5001"
        environment:
            - PORT=5001
            - HOST=0.0.0.0
            - DATABASE_URL=postgresql://fin:fin@db:5432/fin
            - POSTGRES_HOST=db
            - POSTGRES_PORT=5432
            - POSTGRES_DB=fin
            - POSTGRES_USER=fin
            - POSTGRES_PASSWORD=fin
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            target: ${DOCKER_TARGET:-development}
        expose:
            - "5173"
            - "3000"
        environment:
            - VITE_API_URL=http://localhost:5001
            - INTERNAL_API_URL=http://backend:5001
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
      
    db:
      image: postgres:18-alpine
      restart: always
      environment:
        POSTGRES_DB: fin
        POSTGRES_USER: fin
        POSTGRES_PASSWORD: fin
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U fin -d fin"]
        interval: 5s
        timeout: 5s
        retries: 12
      volumes:
        - finance_tracker_db_data:/var/lib/postgresql

volumes:
  finance_tracker_db_data:
