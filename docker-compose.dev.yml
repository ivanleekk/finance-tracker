services:
    backend:
        ports:
            - "8000:8000"
        volumes:
            - ./backend:/app
        environment:
            - DEBUG=true

    frontend:
        ports:
            - "5173:5173"
        environment:
            - CHOKIDAR_USEPOLLING=true
        volumes:
            - ./frontend:/app
            - /app/node_modules
      
    db:
        ports:
            - "5432:5432"
