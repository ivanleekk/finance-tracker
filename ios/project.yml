name: FinanceTracker
options:
  bundleIdPrefix: com.ivanlee
  # iOS 18 is the floor: `.tabViewStyle(.sidebarAdaptable)` (iPad sidebar) and
  # onScrollGeometryChange (the QuickAdd pull) both require it.
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Signing MUST live here, not in Xcode's Signing & Capabilities UI: that UI writes to
    # the generated .xcodeproj, which `xcodegen generate` overwrites wholesale. An empty
    # DEVELOPMENT_TEAM here actively blanks the team on every regenerate ("Signing for
    # FinanceTracker requires a development team"). Applies to every configuration.
    DEVELOPMENT_TEAM: 9SA33W38S2
    CODE_SIGN_STYLE: Automatic
targets:
  FinanceTracker:
    type: application
    platform: iOS
    sources:
      - FinanceTracker
    # Declare the scheme here so `xcodegen generate` always (re)creates a shared scheme.
    # Without this, the generated .xcodeproj has NO scheme and Xcode can't build/run until
    # it auto-creates one — and every regenerate would wipe it again.
    scheme:
      testTargets:
        - FinanceTrackerTests
    info:
      path: FinanceTracker/Info.plist
      properties:
        CFBundleDisplayName: Waypoint
        UILaunchScreen: {}
        # iPhone stays portrait-only; iPad must declare all four or it forfeits Split View
        # and Stage Manager (iPadOS only offers multitasking to fully rotatable apps).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The dev backend is plain http on localhost / LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: Used to unlock your private financial data.
        NSLocalNetworkUsageDescription: Used to reach your finance tracker backend running on your local network during development.
        # Backend endpoint baked in per build configuration; read via AppConfig.defaultBaseURL.
        API_BASE_URL: $(API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivanlee.financetracker
        # 1 = iPhone, 2 = iPad. Universal.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Debug builds also honour a runtime override (More ▸ API Server) for on-device
        # testing; Release builds ignore that override and always use this baked-in value.
        # Release MUST stay https: App Transport Security only exempts localhost/LAN here
        # (NSAllowsLocalNetworking), so a plain-http production URL is blocked outright.
        Debug:
          API_BASE_URL: http://localhost:8000
        Release:
          API_BASE_URL: https://financeapi.ivanleekaikiat.com
  # Logic unit tests (Swift Testing). Because this target depends on the app target,
  # XcodeGen auto-wires TEST_HOST + BUNDLE_LOADER so `@testable import FinanceTracker`
  # resolves against the built app. Run with:
  #   xcodebuild -project FinanceTracker.xcodeproj -scheme FinanceTracker \
  #     -destination 'platform=iOS Simulator,name=iPhone 17 Pro' test
  #
  # Keep this target's `info` generated (GENERATE_INFOPLIST_FILE) — pointing it at the app's
  # Info.plist makes XcodeGen rewrite that file's CFBundlePackageType to BNDL and strips the
  # app's own bundle id, which silently renames the app to com.ivanlee.FinanceTracker.
  FinanceTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FinanceTrackerTests
    dependencies:
      - target: FinanceTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivanlee.financetracker.tests
        GENERATE_INFOPLIST_FILE: "YES"
