# Production stack for a single VPS. See DEPLOYMENT.md for the full runbook.
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Note: -f is passed explicitly so docker-compose.override.yml (dev-only
# bind mounts / reload settings) is never merged in.

services:
    # One-shot: applies Alembic migrations against Neon, then exits. Kept out
    # of the backend's own CMD so a plain restart/redeploy never blocks the
    # port bind on a migration run (see backend/Dockerfile).
    migrate:
        build:
            context: ./backend
            target: production
        restart: "no"
        environment:
            - DATABASE_URL=${DATABASE_URL:?set in .env.production}
        command: ["uv", "run", "alembic", "upgrade", "head"]

    backend:
        build:
            context: ./backend
            target: production
        restart: unless-stopped
        # Not exposed to the host: the shared edge Caddy (~/edge-proxy) reaches
        # it over the `edge` network. `default` keeps it reachable from
        # migrate/scheduler exactly as before.
        networks:
            - default
            - edge
        expose:
            - "8000"
        environment:
            - PORT=8000
            - NODE_ENV=production
            # Neon (managed Postgres) connection string, e.g.
            # postgresql://user:pass@ep-xxx.ap-southeast-1.aws.neon.tech/fin?sslmode=require
            - DATABASE_URL=${DATABASE_URL:?set in .env.production}
            - SECRET_KEY=${SECRET_KEY:?set in .env.production}
            - SCHEDULER_SECRET=${SCHEDULER_SECRET:?set in .env.production}
            - API_URL=https://${API_DOMAIN}
            - CORS_ORIGINS=https://${FRONTEND_DOMAIN}
            - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:?set in .env.production}
        depends_on:
            migrate:
                condition: service_completed_successfully

    frontend:
        build:
            context: ./frontend
            target: production
            args:
                # Baked into the client bundle at build time.
                VITE_API_URL: https://${API_DOMAIN}
        restart: unless-stopped
        # Not exposed to the host: the shared edge Caddy (~/edge-proxy) reaches
        # it over the `edge` network.
        networks:
            - default
            - edge
        expose:
            - "8080"
        environment:
            - NODE_ENV=production
            - VITE_API_URL=https://${API_DOMAIN}
            # SSR loaders/actions talk to the backend over the compose network.
            - INTERNAL_API_URL=http://backend:8000

    # Receives GitHub's push webhook and re-runs the "Deploying updates"
    # steps from DEPLOYMENT.md. Talks to the *host's* dockerd over the
    # bind-mounted socket (Docker-outside-of-Docker), which is why REPO_DIR
    # must be the repo's real absolute path on the VPS host, not a
    # container-local one: docker compose resolves this file's own relative
    # bind mounts (build contexts, …) against that path, and those resolved
    # paths are sent to the host daemon, which has no idea what a
    # container-local alias like /repo would mean. Mounting REPO_DIR to
    # itself keeps the string identical on both sides. See DEPLOYMENT.md
    # "Continuous deployment" for the one-time setup, including the route
    # to add on the shared ~/edge-proxy Caddy.
    webhook:
        build:
            context: ./deploy/webhook
        restart: unless-stopped
        # Not exposed to the host: the shared edge Caddy (~/edge-proxy)
        # reaches it over the `edge` network, same as backend/frontend.
        networks:
            - default
            - edge
        environment:
            - WEBHOOK_SECRET=${WEBHOOK_SECRET:?set in .env.production}
            - DEPLOY_BRANCH=${DEPLOY_BRANCH:-refs/heads/main}
            - REPO_DIR=${REPO_DIR:?set in .env.production}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ${REPO_DIR:?set in .env.production}:${REPO_DIR:?set in .env.production}
            # Reuses whatever git-pull credentials already work on the VPS
            # host (SSH key + known_hosts) — see DEPLOYMENT.md before
            # pointing this at your personal key rather than a scoped
            # deploy key.
            - ${SSH_DIR:?set in .env.production}:/root/.ssh:ro
        expose:
            - "9000"

    # Replaces Cloud Scheduler: fires the daily snapshot/dividend catch-up job.
    # The endpoint is idempotent and catches up from the last snapshot date,
    # so a missed run self-heals on the next one.
    scheduler:
        image: alpine:3.21
        restart: unless-stopped
        environment:
            - SCHEDULER_SECRET=${SCHEDULER_SECRET}
        # The crontab line is written with the secret expanded at container
        # start (busybox crond gives jobs a minimal environment).
        command: >
            sh -c 'printf "0 1 * * * wget -q -O - --header \"X-Scheduler-Secret: $$SCHEDULER_SECRET\" --post-data= http://backend:8000/internal/tasks/daily-snapshot\n" | crontab - && crond -f -l 2'
        depends_on:
            - backend

networks:
    default:
    edge:
        external: true