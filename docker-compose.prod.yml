services:
    backend:
        build:
            context: ./backend
            target: production
        ports:
            - "5001:5001"
        env_file:
            - ./backend/.env.production
        environment:
            - DEBUG=false


    frontend:
        build:
            context: ./frontend
            target: production
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production