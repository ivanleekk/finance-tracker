org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Java toolchain. The build compiles for 17 and also *runs* its compilers on 17, so it no
# longer depends on whichever `java` happens to be first on PATH -- a Homebrew bump to
# 26.0.2.1 failed every invocation, including `./gradlew help`, with a bare "26.0.2.1" and
# nothing else, because the Kotlin the daemon compiles build scripts with cannot parse a
# four-part version string. AGP 8.7 does not support a JDK that new either.
#
# The pin itself is NOT here -- it cannot be. Two separate JVMs needed pinning:
#   * the Gradle daemon, which compiles the .gradle.kts scripts   -> gradle/gradle-daemon-jvm.properties
#   * the compilers used on app sources                            -> `kotlin { jvmToolchain(17) }` in app/build.gradle.kts
# Both provision through the foojay resolver declared in settings.gradle.kts.
#
# Auto-download is already Gradle's default; it is stated explicitly only so that a
# developer's user-global ~/.gradle/gradle.properties cannot quietly turn it off and take
# the toolchain with it.
org.gradle.java.installations.auto-download=true
