steps:
    # 1. Build Backend
    - name: "gcr.io/cloud-builders/docker"
      id: "build-backend"
      args:
          [
              "build",
              "-t",
              "$_REGION-docker.pkg.dev/$PROJECT_ID/finance-tracker/backend:$_TAG",
              "--target",
              "production",
              "./backend",
          ]
      env: ["DOCKER_BUILDKIT=1"]

    # 2. Push Backend
    - name: "gcr.io/cloud-builders/docker"
      id: "push-backend"
      args:
          [
              "push",
              "$_REGION-docker.pkg.dev/$PROJECT_ID/finance-tracker/backend:$_TAG",
          ]

    # 3. Deploy Backend
    - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
      id: "deploy-backend"
      args:
          [
              "gcloud",
              "run",
              "deploy",
              "backend$_SERVICE_SUFFIX",
              "--image",
              "$_REGION-docker.pkg.dev/$PROJECT_ID/finance-tracker/backend:$_TAG",
              "--region",
              "$_REGION",
              "--platform",
              "managed",
              "--allow-unauthenticated",
              "--set-secrets",
              "DATABASE_URL=$_DB_SECRET:latest",
              "--set-env-vars",
              "API_URL=$_API_URL,CORS_ORIGINS=$_ENV_CORS_ORIGIN,AUTH_COOKIE_DOMAIN=.ivanleekaikiat.com,NODE_ENV=production",
          ]
    # 4. Build Frontend (Using the static custom domain)
    - name: "gcr.io/cloud-builders/docker"
      id: "build-frontend"
      args:
          [
              "build",
              "--build-arg",
              "VITE_API_URL=$_API_URL",
              "-t",
              "$_REGION-docker.pkg.dev/$PROJECT_ID/finance-tracker/frontend:$_TAG",
              "--target",
              "production",
              "./frontend",
          ]
      env: ["DOCKER_BUILDKIT=1"]

    # 5. Push Frontend
    - name: "gcr.io/cloud-builders/docker"
      id: "push-frontend"
      args:
          [
              "push",
              "$_REGION-docker.pkg.dev/$PROJECT_ID/finance-tracker/frontend:$_TAG",
          ]

    # 6. Deploy Frontend
    - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
      id: "deploy-frontend"
      args:
          [
              "gcloud",
              "run",
              "deploy",
              "frontend$_SERVICE_SUFFIX",
              "--image",
              "$_REGION-docker.pkg.dev/$PROJECT_ID/finance-tracker/frontend:$_TAG",
              "--region",
              "$_REGION",
              "--platform",
              "managed",
              "--allow-unauthenticated",
              "--set-env-vars",
              "VITE_API_URL=$_API_URL,INTERNAL_API_URL=$_API_URL",
          ]

substitutions:
    _REGION: asia-southeast1
    _TAG: latest
    _API_URL: https://financeapi.ivanleekaikiat.com
    _SERVICE_SUFFIX: "" # Empty for production
    _ENV_CORS_ORIGIN: https://finance.ivanleekaikiat.com
    _DB_SECRET: FINANCE_TRACKER_DB_URL

options:
    logging: CLOUD_LOGGING_ONLY

images:
    - "$_REGION-docker.pkg.dev/$PROJECT_ID/finance-tracker/backend:$_TAG"
    - "$_REGION-docker.pkg.dev/$PROJECT_ID/finance-tracker/frontend:$_TAG"
